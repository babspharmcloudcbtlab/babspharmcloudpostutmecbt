<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage Subjects — Admin Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --blue: #1a3bbd; --blue-dark: #122894; --blue-light: #2d52e0;
    --gold: #f5a623; --gray-50: #f8f9fc; --gray-100: #eef0f7;
    --gray-200: #d8dce8; --gray-400: #8b92a9; --gray-600: #4a5068;
    --gray-800: #1e2235; --success: #38a169; --error: #e53e3e;
    --sidebar-w: 240px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'DM Sans', sans-serif; background: var(--gray-50); color: var(--gray-800); min-height: 100vh; display: flex; }

  .sidebar {
    width: var(--sidebar-w); background: #0f1f6e; height: 100vh;
    position: fixed; left: 0; top: 0; display: flex; flex-direction: column;
    z-index: 100; transition: transform 0.3s; overflow-y: auto;
  }
  .sidebar-logo { padding: 20px 16px; border-bottom: 1px solid rgba(255,255,255,0.1); display: flex; align-items: center; gap: 10px; }
  .logo-icon { width: 38px; height: 38px; background: var(--gold); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; }
  .logo-text h3 { font-family: 'Sora', sans-serif; font-size: 13px; font-weight: 700; color: white; }
  .logo-text p { font-size: 10px; color: rgba(255,255,255,0.5); }
  .nav-section-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: rgba(255,255,255,0.3); padding: 12px 16px 4px; }
  .nav-item { display: flex; align-items: center; gap: 10px; padding: 11px 16px; cursor: pointer; transition: all 0.15s; color: rgba(255,255,255,0.6); font-size: 13px; font-weight: 500; text-decoration: none; margin: 1px 8px; border-radius: 10px; }
  .nav-item:hover { background: rgba(255,255,255,0.08); color: white; }
  .nav-item.active { background: rgba(255,255,255,0.12); color: white; font-weight: 600; }
  .nav-icon { width: 30px; height: 30px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 14px; background: rgba(255,255,255,0.08); flex-shrink: 0; }
  .nav-item.active .nav-icon { background: var(--gold); }

  .main { margin-left: var(--sidebar-w); flex: 1; display: flex; flex-direction: column; }
  .topbar { height: 58px; background: white; border-bottom: 1px solid var(--gray-100); display: flex; align-items: center; padding: 0 24px; gap: 12px; position: sticky; top: 0; z-index: 50; }
  .hamburger { display: none; background: none; border: none; font-size: 20px; cursor: pointer; }
  .topbar-title { font-family: 'Sora', sans-serif; font-size: 16px; font-weight: 700; }
  .topbar-right { margin-left: auto; display: flex; gap: 10px; }
  .logout-btn { padding: 8px 16px; background: rgba(229,62,62,0.08); color: var(--error); border: 1px solid rgba(229,62,62,0.2); border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; }
  .logout-btn:hover { background: var(--error); color: white; }

  .content { padding: 24px; flex: 1; }

  /* TWO COL LAYOUT */
  .page-grid { display: grid; grid-template-columns: 380px 1fr; gap: 20px; }

  /* ADD SUBJECT FORM */
  .form-panel { background: white; border-radius: 16px; padding: 24px; border: 1.5px solid var(--gray-100); height: fit-content; }
  .form-panel h3 { font-family: 'Sora', sans-serif; font-size: 15px; font-weight: 700; margin-bottom: 20px; color: var(--gray-800); }

  .form-group { margin-bottom: 16px; }
  .form-group label { display: block; font-size: 12px; font-weight: 600; color: var(--gray-600); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
  .form-group input, .form-group select {
    width: 100%; padding: 11px 14px; border: 1.5px solid var(--gray-200);
    border-radius: 10px; font-family: 'DM Sans', sans-serif; font-size: 14px;
    color: var(--gray-800); background: var(--gray-50); outline: none;
    transition: border-color 0.2s; appearance: none;
  }
  .form-group input:focus, .form-group select:focus { border-color: var(--blue); background: white; }

  /* EMOJI PICKER */
  .emoji-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin-top: 8px; }
  .emoji-btn {
    width: 38px; height: 38px; border-radius: 8px; border: 2px solid var(--gray-200);
    background: white; cursor: pointer; font-size: 18px; display: flex;
    align-items: center; justify-content: center; transition: all 0.15s;
  }
  .emoji-btn:hover { border-color: var(--blue); transform: scale(1.1); }
  .emoji-btn.selected { border-color: var(--blue); background: rgba(26,59,189,0.08); }

  /* COLOR PICKER */
  .color-grid { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .color-btn {
    width: 32px; height: 32px; border-radius: 8px; cursor: pointer;
    border: 3px solid transparent; transition: all 0.15s;
  }
  .color-btn.selected { border-color: var(--gray-800); transform: scale(1.1); }

  .submit-btn {
    width: 100%; padding: 13px; background: linear-gradient(135deg, var(--blue), var(--blue-light));
    color: white; border: none; border-radius: 10px; font-family: 'Sora', sans-serif;
    font-size: 14px; font-weight: 700; cursor: pointer; transition: all 0.2s; margin-top: 4px;
  }
  .submit-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(26,59,189,0.3); }
  .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

  .alert { padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 14px; display: none; }
  .alert.show { display: block; }
  .alert.error { background: #fff5f5; color: var(--error); border: 1px solid #fed7d7; }
  .alert.success { background: #f0fff4; color: var(--success); border: 1px solid #c6f6d5; }

  /* SUBJECTS LIST */
  .list-panel { background: white; border-radius: 16px; padding: 24px; border: 1.5px solid var(--gray-100); }

  .list-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .list-header h3 { font-family: 'Sora', sans-serif; font-size: 15px; font-weight: 700; color: var(--gray-800); }

  /* UNI FILTER */
  .uni-filter { display: flex; gap: 8px; }
  .filter-btn { padding: 6px 14px; border-radius: 20px; border: 1.5px solid var(--gray-200); background: white; font-size: 12px; font-weight: 600; color: var(--gray-600); cursor: pointer; transition: all 0.15s; }
  .filter-btn.active { background: var(--blue); color: white; border-color: var(--blue); }

  /* SUBJECT ITEM */
  .subject-item {
    display: flex; align-items: center; gap: 14px;
    padding: 14px 0; border-bottom: 1px solid var(--gray-100);
  }
  .subject-item:last-child { border-bottom: none; }

  .subj-icon { width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0; }
  .subj-info { flex: 1; }
  .subj-name { font-family: 'Sora', sans-serif; font-size: 14px; font-weight: 700; color: var(--gray-800); }
  .subj-meta { font-size: 12px; color: var(--gray-400); margin-top: 2px; }

  .subj-actions { display: flex; gap: 8px; }
  .icon-btn { width: 32px; height: 32px; border-radius: 8px; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 14px; transition: all 0.15s; }
  .icon-btn.delete { background: rgba(229,62,62,0.08); color: var(--error); }
  .icon-btn.delete:hover { background: var(--error); color: white; }

  .empty-state { text-align: center; padding: 40px; color: var(--gray-400); font-size: 14px; }
  .empty-state .empty-icon { font-size: 40px; margin-bottom: 12px; }

  .sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 99; cursor: pointer; }
  .sidebar-overlay.show { display: block; }

  @media (max-width: 900px) {
    .sidebar { transform: translateX(-100%); }
    .sidebar.open { transform: translateX(0); box-shadow: 6px 0 24px rgba(0,0,0,0.2); }
    .main { margin-left: 0; }
    .hamburger { display: block; }
    .page-grid { grid-template-columns: 1fr; }
    .content { padding: 16px; }
  }
</style>
</head>
<body>

<div class="sidebar-overlay" id="sidebar-overlay" onclick="closeSidebar()"></div>

<aside class="sidebar" id="sidebar">
  <div class="sidebar-logo">
    <div class="logo-icon">⚙️</div>
    <div class="logo-text"><h3>Admin Portal</h3><p>Post UTME CBT</p></div>
  </div>
  <nav style="flex:1; padding: 12px 0;">
    <div class="nav-section-label">Overview</div>
    <a class="nav-item" href="admin-dashboard.html"><div class="nav-icon">🏠</div> Dashboard</a>
    <div class="nav-section-label">Management</div>
    <a class="nav-item active" href="admin-subjects.html"><div class="nav-icon">📚</div> Subjects</a>
    <a class="nav-item" href="admin-questions.html"><div class="nav-icon">❓</div> Questions</a>
    <a class="nav-item" href="admin-keys.html"><div class="nav-icon">🔑</div> Activation Keys</a>
    <a class="nav-item" href="admin-students.html"><div class="nav-icon">👥</div> Students</a>
    <a class="nav-item" href="admin-announcements.html"><div class="nav-icon">📢</div> Announcements</a>
  </nav>
</aside>

<div class="main">
  <header class="topbar">
    <button class="hamburger" onclick="toggleSidebar()">☰</button>
    <div class="topbar-title">📚 Manage Subjects</div>
    <div class="topbar-right">
      <button class="logout-btn" onclick="handleLogout()">🚪 Logout</button>
    </div>
  </header>

  <div class="content">
    <div class="page-grid">

      <!-- ADD SUBJECT FORM -->
      <div class="form-panel">
        <h3>➕ Add New Subject</h3>

        <div class="alert" id="form-alert"></div>

        <div class="form-group">
          <label>University</label>
          <select id="uni-select">
            <option value="OAU">OAU — Obafemi Awolowo University</option>
            <option value="UI">UI — University of Ibadan</option>
          </select>
        </div>

        <div class="form-group">
          <label>Subject Name</label>
          <input type="text" id="subject-name" placeholder="e.g. Biology, Mathematics">
        </div>

        <div class="form-group">
          <label>Choose Icon</label>
          <div class="emoji-grid" id="emoji-grid">
            <!-- Emojis inserted by JS -->
          </div>
        </div>

        <div class="form-group">
          <label>Choose Color</label>
          <div class="color-grid" id="color-grid"></div>
        </div>

        <button class="submit-btn" id="add-btn" onclick="addSubject()">Add Subject →</button>
      </div>

      <!-- SUBJECTS LIST -->
      <div class="list-panel">
        <div class="list-header">
          <h3>All Subjects</h3>
          <div class="uni-filter">
            <button class="filter-btn active" onclick="filterSubjects('ALL', this)">All</button>
            <button class="filter-btn" onclick="filterSubjects('OAU', this)">OAU</button>
            <button class="filter-btn" onclick="filterSubjects('UI', this)">UI</button>
          </div>
        </div>
        <div id="subjects-list"><div class="empty-state"><div class="empty-icon">📚</div>Loading subjects...</div></div>
      </div>

    </div>
  </div>
</div>

<script>
  const SUPABASE_URL = 'https://xdixrqlhctisthfdvzvn.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhkaXhycWxoY3Rpc3RoZmR2enZuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk3MTQ1MjEsImV4cCI6MjA5NTI5MDUyMX0.mazAzPT_g_j2L-_ahFz2POO8X5WiymmWLKdoWD3Ziag';
  const { createClient } = supabase;
  const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const EMOJIS = ['📝','📐','🧬','⚗️','⚡','📈','📖','🔬','🌍','💡','🧪','🔭','📊','🧮','🖊️','🌱','🏛️','💻','🎯','🧠'];
  const COLORS = ['#ebf4ff','#f0fff4','#fff0f0','#fffbeb','#f0f4ff','#f0fffe','#fdf4ff','#fff5f0','#f5fff0','#f0f0ff'];

  let selectedEmoji = '📝';
  let selectedColor = '#ebf4ff';
  let allSubjects = [];
  let currentFilter = 'ALL';

  async function init() {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) { window.location.href = 'admin-login.html'; return; }
    const { data: adminData } = await sb.from('admins').select('id').eq('id', session.user.id).single();
    if (!adminData) { window.location.href = 'admin-login.html'; return; }

    buildEmojiPicker();
    buildColorPicker();
    loadSubjects();
  }

  function buildEmojiPicker() {
    const grid = document.getElementById('emoji-grid');
    grid.innerHTML = EMOJIS.map(e => `
      <button class="emoji-btn ${e === selectedEmoji ? 'selected' : ''}" onclick="selectEmoji('${e}', this)">${e}</button>
    `).join('');
  }

  function buildColorPicker() {
    const grid = document.getElementById('color-grid');
    grid.innerHTML = COLORS.map(c => `
      <div class="color-btn ${c === selectedColor ? 'selected' : ''}" style="background:${c}" onclick="selectColor('${c}', this)"></div>
    `).join('');
  }

  function selectEmoji(emoji, btn) {
    selectedEmoji = emoji;
    document.querySelectorAll('.emoji-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
  }

  function selectColor(color, btn) {
    selectedColor = color;
    document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
  }

  function showAlert(msg, type) {
    const el = document.getElementById('form-alert');
    el.textContent = msg;
    el.className = 'alert show ' + type;
    setTimeout(() => el.className = 'alert', 4000);
  }

  async function addSubject() {
    const name = document.getElementById('subject-name').value.trim();
    const uni = document.getElementById('uni-select').value;

    if (!name) return showAlert('Please enter a subject name.', 'error');

    const btn = document.getElementById('add-btn');
    btn.disabled = true; btn.textContent = 'Adding...';

    try {
      const { error } = await sb.from('subjects').insert({
        name, university: uni, icon: selectedEmoji, color: selectedColor, question_count: 0
      });

      if (error) throw error;

      showAlert(`✅ "${name}" added for ${uni}!`, 'success');
      document.getElementById('subject-name').value = '';
      loadSubjects();

    } catch(e) {
      showAlert(e.message || 'Failed to add subject.', 'error');
    } finally {
      btn.disabled = false; btn.textContent = 'Add Subject →';
    }
  }

  async function loadSubjects() {
    const container = document.getElementById('subjects-list');
    try {
      const { data, error } = await sb.from('subjects').select('*').order('university').order('name');
      if (error) throw error;
      allSubjects = data || [];
      renderSubjects();
    } catch(e) {
      container.innerHTML = '<div class="empty-state"><div class="empty-icon">❌</div>Failed to load subjects</div>';
    }
  }

  function filterSubjects(filter, btn) {
    currentFilter = filter;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderSubjects();
  }

  function renderSubjects() {
    const container = document.getElementById('subjects-list');
    const filtered = currentFilter === 'ALL' ? allSubjects : allSubjects.filter(s => s.university === currentFilter);

    if (filtered.length === 0) {
      container.innerHTML = '<div class="empty-state"><div class="empty-icon">📚</div>No subjects found. Add one!</div>';
      return;
    }

    container.innerHTML = filtered.map(s => `
      <div class="subject-item">
        <div class="subj-icon" style="background:${s.color || '#ebf4ff'}">${s.icon || '📝'}</div>
        <div class="subj-info">
          <div class="subj-name">${s.name}</div>
          <div class="subj-meta">${s.university} • ${s.question_count || 0} questions</div>
        </div>
        <div class="subj-actions">
          <button class="icon-btn delete" onclick="deleteSubject('${s.id}', '${s.name}')" title="Delete">🗑️</button>
        </div>
      </div>
    `).join('');
  }

  async function deleteSubject(id, name) {
    if (!confirm(`Delete "${name}"? This will also delete all its questions!`)) return;
    try {
      await sb.from('questions').delete().eq('subject_id', id);
      await sb.from('subjects').delete().eq('id', id);
      showAlert(`"${name}" deleted.`, 'success');
      loadSubjects();
    } catch(e) {
      showAlert('Failed to delete subject.', 'error');
    }
  }

  function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('open');
    document.getElementById('sidebar-overlay').classList.toggle('show');
  }

  function closeSidebar() {
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('sidebar-overlay').classList.remove('show');
  }

  async function handleLogout() { await sb.auth.signOut(); window.location.href = 'admin-login.html'; }

  init();
</script>
</body>
</html>
